name: Auto PR et Sync Branches

on:
  push:
    branches-ignore:
      - 'main' # Se déclenche sur un push de n'importe quelle branche, SAUF main

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge-and-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Créer et merger la Pull Request vers main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Crée la PR (ignore l'erreur si elle existe déjà pour cette branche)
          gh pr create --base main --head "${{ github.ref_name }}" --title "Auto-PR : ${{ github.ref_name }} vers main" --body "Fusion automatique de la branche de développeur vers main." || true
          
          # Fusionne la PR automatiquement
          gh pr merge "${{ github.ref_name }}" --auto --merge || gh pr merge "${{ github.ref_name }}" --merge

      - name: Restaurer les permissions du workspace
        run: sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE"

      - name: Synchroniser main vers les autres branches
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Récupération de toutes les branches distantes
          git fetch origin
          
          # Liste des branches à exclure (main et la branche du dev qui vient de pousser)
          EXCLUDED_BRANCHES=("main" "${{ github.ref_name }}")
          
          # Boucle sur toutes les branches distantes
          for branch in $(git branch -r | grep 'origin/' | grep -v 'HEAD'); do
            clean_branch=${branch#origin/}
            
            # Vérifier si la branche est dans la liste des exclues
            skip=false
            for ex in "${EXCLUDED_BRANCHES[@]}"; do
              if [ "$clean_branch" == "$ex" ]; then
                skip=true
                break
              fi
            done
            
            if [ "$skip" == "false" ]; then
              echo "Mise à jour de la branche : $clean_branch"
              git checkout -B "$clean_branch" "origin/$clean_branch"
              git merge origin/main --no-edit || { echo "Conflit détecté sur $clean_branch"; git merge --abort; exit 1; }
              git push origin "$clean_branch"
            fi
          done
