name: Auto PR et Sync Branches

on:
  push:
    branches:
      - 'feature/**' # Modifiez selon le nom de vos branches de départ (ex: dev, feature/*)

jobs:
  auto-merge-and-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Créer et merger la Pull Request vers main
        uses: repo-sync/pull-request@v2
        with:
          source_branch: "${{ github.ref_name }}"
          destination_branch: "main"
          github_token: "${{ secrets.GITHUB_TOKEN }}"
          pr_title: "Auto-PR : ${{ github.ref_name }} vers main"
          pr_body: "Fusion automatique déclenchée par un push."
          pr_allow_empty: true
          # Note : Ce système gère la création/merge. Assurez-vous que vos branches ne se suppriment pas automatiquement dans les paramètres du dépôt.

      - name: Synchroniser main vers les autres branches
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Récupération de toutes les branches distantes
          git fetch origin
          
          # Liste des branches à exclure de la mise à jour automatique (main et la branche source actuelle)
          EXCLUDED_BRANCHES=("main" "${{ github.ref_name }}")
          
          # Récupération de toutes les branches distantes
          for branch in $(git branch -r | grep 'origin/' | grep -v 'HEAD'); do
            clean_branch=${branch#origin/}
            
            # Vérifier si la branche est dans la liste des exclues
            skip=false
            for ex in "${EXCLUDED_BRANCHES[@]}"; do
              if [ "$clean_branch" == "$ex" ]; then
                skip=true
                break
              fi
            done
            
            if [ "$skip" == "false" ]; then
              echo "Mise à jour de la branche : $clean_branch"
              git checkout "$clean_branch"
              git merge origin/main --no-edit || { echo "Conflit détecté sur $clean_branch"; git merge --abort; exit 1; }
              git push origin "$clean_branch"
            fi
          done
